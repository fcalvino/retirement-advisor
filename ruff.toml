target-version = "py310"
line-length = 100
exclude = ["venv", ".venv", "__pycache__"]

[lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",   # line too long — enforced by formatter, not linter
    "E741",   # ambiguous variable names (l, O, I)
    "E402",   # module import not at top — Streamlit pages use mid-file lazy imports
    "W291",   # trailing whitespace — intentional in prompt markdown templates
]

[lint.isort]
known-first-party = [
    "analysis", "alerts", "config", "data", "dashboard", "portfolio", "scripts"
]
