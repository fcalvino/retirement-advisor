name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # The lock first: CI tests the same pins the Docker image and the local venv
          # install (STREAMLIT-ALIGN). requirements-dev.txt then only adds the dev
          # tools (ruff, xlrd); its -r requirements.txt is already satisfied.
          pip install --require-hashes -r requirements.lock
          pip install -r requirements-dev.txt   # ruff fijado (#150) + xlrd

      - name: Lint with ruff
        run: ruff check . --output-format=github

      - name: Run tests
        env:
          # Tests run without real API keys — mocks handle all network calls
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
          AI_ENABLED: "false"
          CACHE_TTL_HOURS: "1"
        run: pytest tests/ -v --tb=short

  # Static dead-code scan — informational only (must not block merges).
  dead-code:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install vulture
        run: |
          pip install --upgrade pip
          pip install vulture

      - name: Run vulture (min-confidence 80)
        run: |
          vulture \
            alerts analysis dashboard data portfolio reports \
            main.py config.py config_validator.py scripts bootstrap.py \
            --min-confidence 80 \
            --exclude '*__pycache__*,venv,.venv,qa,tests'
